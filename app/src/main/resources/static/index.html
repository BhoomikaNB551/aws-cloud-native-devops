<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forever ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Georgia, serif;
            background: url('/bhoomi.jpeg') center center / cover no-repeat;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
        }

        .love-message {
            position: relative;
            z-index: 1;
            color: white;
            padding: 30px;
        }

        h1 {
            font-size: clamp(2.5rem, 7vw, 5.5rem);
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
        }

        .heart {
            font-size: 3rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="love-message">
        <div class="heart">❤️</div>
        <h1>Keetu, You Are My Forever.</h1>
    </div>
</body>
</html>
