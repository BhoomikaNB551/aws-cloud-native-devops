<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forever ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
            font-family: Georgia, serif;
        }

        .message {
            height: 18vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
        }

        .typing {
            color: white;
            font-size: clamp(1.2rem, 4vw, 2.2rem);
            white-space: nowrap;
            overflow: hidden;
            border-right: 2px solid white;
            width: 0;
            animation:
                typing 4s steps(30, end) forwards,
                blink 0.7s step-end infinite;
        }

        .photo-container {
            height: 82vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        @keyframes typing {
            from {
                width: 0;
            }
            to {
                width: 30ch;
            }
        }

        @keyframes blink {
            50% {
                border-color: transparent;
            }
        }
    </style>
</head>

<body>

    <div class="message">
        <div class="typing">❤️ I love you forever</div>
    </div>

    <div class="photo-container">
        <img class="photo" src="/bhoomi.jpeg" alt="Forever">
    </div>

</body>
</html>
